# name: Satya Aggregator

# on:
#   schedule:
#     # Runs every 30 minutes (data upstream only changes when the classifier runs)
#     - cron: '*/30 * * * *'
#   workflow_dispatch:

# concurrency:
#   group: satya-aggregator
#   cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-satya-aggregator-v1

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Aggregator
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          ENTITIES_JSON_URL: ${{ secrets.ENTITIES_JSON_URL }}
          PROMISES_JSON_URL: ${{ secrets.PROMISES_JSON_URL }}
        run: |
          python aggregator.py

      - name: Commit aggregated JSONs back to repo
        run: |
          git config --local user.email "satya-bot@github.com"
          git config --local user.name "Satya Bot"
          git add api/
          git diff --staged --quiet || git commit -m "Auto-update aggregated JSONs [$(date '+%Y-%m-%d %H:%M')]"
          git push

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggregator-output-${{ github.run_number }}
          path: |
            api/
            *.log
          retention-days: 7
